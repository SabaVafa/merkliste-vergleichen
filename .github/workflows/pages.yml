# Publishes the prototype (Version B) as the site root:
# https://sabavafa.github.io/merkliste-vergleichen/ = Deliverables/vergleichen-flow-B/index.html
# Only that folder goes online – the docs and data stay in the repository.
# Settings → Pages → Source must be "GitHub Actions".
name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Deliverables/vergleichen-flow-B/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Deliverables/vergleichen-flow-B
      - id: deployment
        uses: actions/deploy-pages@v4
